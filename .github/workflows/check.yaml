name: Check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, to catch Pi releases that break the editor integration.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  latest-pi:
    name: Test against latest Pi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install latest Pi packages
        run: >-
          bun add --dev
          @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest

      - name: Run checks
        run: bun run check

  changelog:
    name: Validate changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate changelog entries
        run: uvx tenzir-ship validate --lenient

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:latest -color
